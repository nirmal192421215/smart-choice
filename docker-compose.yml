# Smart Choice Docker Compose - Local Development
# Run: docker compose up --build

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: smart-choice-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=5001
      - FRONTEND_URL=http://localhost:5173
    volumes:
      # Mount source for hot reload during development
      - ./backend/src:/app/src
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/package.json:/app/package.json
    command: sh -c "npm ci && npx tsx watch src/index.ts"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - smart-choice-network

  # Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: smart-choice-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/package.json:/app/package.json
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      # Exclude node_modules from volume mount (use image's node_modules)
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smart-choice-network

networks:
  smart-choice-network:
    driver: bridge