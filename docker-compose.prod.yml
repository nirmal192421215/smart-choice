# Smart Choice Docker Compose - Production
# Run: docker compose -f docker-compose.prod.yml up --build -d
# Or deploy to: Render, Railway, Fly.io, or VPS

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-choice-backend-prod
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - smart-choice-network

  # Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-choice-frontend-prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smart-choice-network

networks:
  smart-choice-network:
    driver: bridge