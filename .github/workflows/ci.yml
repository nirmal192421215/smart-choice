# ─────────────────────────────────────────────────────────────
# Smart Choice CI/CD Pipeline
# Runs on every push to main and pull requests
# ─────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'
  BACKEND_PORT: 5001
  FRONTEND_PORT: 5173

jobs:
  ──────────────────────────────────────────────────────────
  # 1️⃣ Lint & Type Check
  ──────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run backend lint
        working-directory: ./backend
        run: npm run lint

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

  ──────────────────────────────────────────────────────────
  # 2️⃣ Type Check
  ──────────────────────────────────────────────────────────
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check backend
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: TypeScript check frontend
        working-directory: ./frontend
        run: npx tsc --noEmit

  ──────────────────────────────────────────────────────────
  # 3️⃣ Tests
  ──────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test -- --passWithNoTests || echo "No backend tests configured"

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --passWithNoTests || echo "No frontend tests configured"

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  ──────────────────────────────────────────────────────────
  # 4️⃣ Build (Production)
  ──────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build Backend Docker image
        working-directory: ./backend
        run: |
          docker build -t smart-choice-backend:${{ github.sha }} .

      - name: Build Frontend Docker image
        working-directory: ./frontend
        run: |
          docker build -t smart-choice-frontend:${{ github.sha }} .

      - name: Verify images
        run: |
          docker images | grep smart-choice

  ──────────────────────────────────────────────────────────
  # 5️⃣ Deploy Backend (Production)
  ──────────────────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://api.smartchoice.in

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: johnwatsonroy/render-deploy@v0.0.4
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
          api-key: ${{ secrets.RENDER_API_KEY }}

  ──────────────────────────────────────────────────────────
  # 6️⃣ Deploy Frontend (Production)
  ──────────────────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://smartchoice.in

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          vercel-args: '--prod'